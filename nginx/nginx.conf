server {
    listen 443 ssl;
    server_name api.pharmacityassist.online;
    ssl_certificate /etc/letsencrypt/live/api.pharmacityassist.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pharmacityassist.online/privkey.pem;

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://pharmacy_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name api.pharmacityassist.online;
    return 301 https://$host$request_uri;
}
