version: "3.9"

services:
  db:
    image: postgres:15
    container_name: pharmacy_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pharmacy_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin123@gamil.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"

  redis:
    image: redis:7
    container_name: pharmacy_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: pharmacy_web
    command: gunicorn pharma_city.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
    - "8000:8000"
    expose:
      - "8000"
    depends_on:
      - db
      - redis
  
  nginx:
    image: nginx:latest
    container_name: pharmacy_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
      - ./media:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  postgres_data:
